<title>SH Meridian — Launching Soon</title>

<style>
  :root {
    --navy-deep: #081420;
    --navy: #0B1E33;
    --navy-panel: #122A42;
    --line-soft: rgba(217, 228, 236, 0.09);
    --ink: #EDF1F4;
    --ink-muted: #8CA2B5;
    --brass: #C9A24B;
    --brass-soft: rgba(201, 162, 75, 0.35);
    --teal: #5FB8C0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--navy);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow-x: hidden;
    background:
      radial-gradient(ellipse 90% 70% at 50% 38%, var(--navy-panel) 0%, var(--navy) 55%, var(--navy-deep) 100%);
  }

  .globe-wrap {
    position: fixed;
    top: 50%;
    left: 50%;
    width: min(1400px, 145vmin);
    height: min(1400px, 145vmin);
    transform: translate(-50%, -50%);
    color: var(--ink);
    pointer-events: none;
    z-index: 0;
    mask-image: radial-gradient(circle at center, black 40%, transparent 75%);
    -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 75%);
  }

  .globe-grid {
    width: 100%;
    height: 100%;
    animation: rotate-globe 220s linear infinite;
    transform-origin: 50% 50%;
  }

  @keyframes rotate-globe {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .globe-grid { animation: none; }
  }

  header {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: center;
    padding: 48px 24px 0;
  }

  .brandmark {
    height: 70px;
    width: auto;
    opacity: 0.96;
  }

  main {
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px 24px;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin: 0 0 28px;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: clamp(32px, 5vw, 58px);
    line-height: 1.12;
    letter-spacing: -0.01em;
    margin: 0 0 20px;
    max-width: 820px;
  }

  h1 em {
    font-style: normal;
    color: var(--brass);
  }

  .subhead {
    font-size: clamp(15px, 1.6vw, 18px);
    line-height: 1.6;
    color: var(--ink-muted);
    max-width: 520px;
    margin: 0 0 44px;
    font-weight: 400;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 22px;
    border: 1px solid var(--brass-soft);
    border-radius: 999px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--brass);
    margin-bottom: 56px;
  }

  .ping {
    position: relative;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--brass);
    flex-shrink: 0;
  }

  .ping::before {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 1px solid var(--brass);
    animation: sonar 2.4s ease-out infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    .ping::before { animation: none; opacity: 0; }
  }

  @keyframes sonar {
    0%   { transform: scale(0.4); opacity: 0.9; }
    100% { transform: scale(2.6); opacity: 0; }
  }

  .coords {
    display: flex;
    gap: clamp(28px, 6vw, 96px);
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 48px;
  }

  .coord {
    text-align: left;
    padding-left: 16px;
    border-left: 1px solid var(--line-soft);
    min-width: 200px;
  }

  .coord .val {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--teal);
    letter-spacing: 0.02em;
    margin-bottom: 6px;
  }

  .coord .loc {
    display: block;
    font-size: 13px;
    color: var(--ink-muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .contact {
    font-size: 14px;
    color: var(--ink-muted);
  }

  .contact a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--brass-soft);
    padding-bottom: 1px;
    transition: border-color 0.2s ease, color 0.2s ease;
  }

  .contact a:hover,
  .contact a:focus-visible {
    color: var(--brass);
    border-color: var(--brass);
  }

  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--teal);
    outline-offset: 3px;
  }

  footer {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 28px 24px 36px;
    font-size: 12px;
    color: var(--ink-muted);
    border-top: 1px solid var(--line-soft);
  }

  footer .entities {
    margin-top: 6px;
    opacity: 0.75;
  }

  @media (max-width: 560px) {
    .coords { gap: 24px; }
    .coord { min-width: 150px; }
    .status { font-size: 10.5px; padding: 9px 16px; }
  }
</style>
</head>
